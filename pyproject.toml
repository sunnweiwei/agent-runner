[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4sci-agent-runner"
version = "0.1.0"
description = "A minimal long-running model-development harness for Harbor tasks."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "harbor==0.22.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "foldbench_smoke: Docker integration test using the real FoldBench Harbor task",
]
